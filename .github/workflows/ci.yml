name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solidity:
    name: forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge test
        working-directory: contracts
        run: forge test

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r server/requirements.txt
      - name: unit tests
        env:
          KH_API_KEY: kh_test_key
        run: python server/test_plow.py

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: static export
        working-directory: frontend
        run: npm run build
